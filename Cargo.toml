[workspace]
resolver = "2"
members = [
    "crates/voipc-protocol",
    "crates/voipc-audio",
    "crates/voipc-video",
    "crates/voipc-crypto",
    "crates/voipc-media",
    "crates/voipc-import",
    "crates/voipc-server",
    "client/src-tauri",
]
# The wasm crates are their own workspaces: they enable wasm-only features that
# must never leak into the native build. fuzz/ runs on nightly.
exclude = ["crates/voipc-web", "crates/voipc-opus-wasm", "crates/voipc-media-wasm", "fuzz"]

[workspace.package]
version = "1.12.1"
edition = "2021"
license = "MIT"
# The toolchain CI tests with (rust-toolchain.toml)
rust-version = "1.99"

[workspace.dependencies]
voipc-protocol = { path = "crates/voipc-protocol" }
voipc-audio = { path = "crates/voipc-audio" }
voipc-video = { path = "crates/voipc-video" }
voipc-crypto = { path = "crates/voipc-crypto" }

serde = { version = "1.0", features = ["derive"] }
postcard = { version = "1.1", features = ["alloc"] }

tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }

cpal = "0.15"
audiopus = "0.3.0-rc.0"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

anyhow = "1.0"
thiserror = "2.0"
bytes = "1"

# Debug builds without full debug info: half the disk, and a test binary a quarter
# of the size. Backtraces keep their file and line in our crates. To inspect
# variables in a debugger: CARGO_PROFILE_DEV_DEBUG=true.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# wtransport 0.7.2 drops half-read control-stream frames, closing about 2 connects in 1000
# on a busy relay (upstream issue #331; test: settings_split_by_the_session_request_still_open_the_session
# in crates/voipc-server/src/web.rs). The fork is upstream's 0.7.2 tag plus that one fix.
# The nightly job wtransport-fork says when upstream releases again; then this block goes,
# or the fork's commit moves onto the release. It must stay a 0.7.x version, or cargo
# quietly ignores it.
[patch.crates-io]
wtransport = { git = "https://github.com/luki4fun/wtransport.git", tag = "0.7.2-voipc.1" }
