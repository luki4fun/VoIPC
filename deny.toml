# cargo-deny, for the root workspace, the two wasm workspaces and the fuzz
# workspace (CI's `deny` job runs it for each manifest). Advisories, licences,
# crate sources and duplicate bans in one tool.
#
# FFmpeg is GPL in the bundles, but it is not a crate, so it is not here: the
# release notes and README carry it.

[graph]
all-features = false

[advisories]
# Only our direct dependencies: an unmaintained crate deep in Tauri's GTK
# stack is not ours to replace.
unmaintained = "workspace"
ignore = [
    # SQLite reading a crafted database with a crafted -wal file. The relay opens
    # only its own accounts database, named in its config and readable by its user
    # only; whoever can write that file and its -wal has the relay's secrets anyway.
    # sqlx 0.9.0 caps libsqlite3-sys below the fixed 0.39; sqlx main allows it
    # (launchbadge/sqlx#4502), unreleased: drop this entry with the first sqlx
    # release that has it (launchbadge/sqlx#4516).
    { id = "RUSTSEC-2026-0459", reason = "relay opens only its own owner-only database; no sqlx release takes libsqlite3-sys 0.39 yet" },
]

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "Unlicense",
    "CC0-1.0",
    "0BSD",
    "WTFPL",
]
# AGPL only where it already is, so it cannot creep in anywhere else unseen.
exceptions = [
    { allow = ["AGPL-3.0-only"], crate = "libsignal-protocol" },
    { allow = ["AGPL-3.0-only"], crate = "libsignal-core" },
    { allow = ["AGPL-3.0-only"], crate = "signal-crypto" },
    { allow = ["AGPL-3.0-only"], crate = "libsignal-debug" },
    { allow = ["AGPL-3.0-only"], crate = "spqr" },
    # LLVM's libFuzzer, built into the fuzz targets only; nothing that ships
    # links it.
    { allow = ["NCSA"], crate = "libfuzzer-sys" },
]

[licenses.private]
# Our own crates are `publish = false`
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/signalapp/libsignal",
    "https://github.com/signalapp/SparsePostQuantumRatchet.git",
    "https://github.com/luki4fun/l4f-accounts.git",
]

[bans]
# Duplicate versions are common through Tauri; reported, not blocking.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
