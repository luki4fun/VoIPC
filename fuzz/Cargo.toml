[package]
name = "voipc-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

# Its own workspace, on nightly: `cargo +nightly fuzz run <target>` from here.
# Each target calls a `fuzz_<name>` function that lives next to the code it
# tests, behind cfg(any(test, fuzzing)), so the crate's own tests replay it
# on stable.
[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4"
voipc-opus-wasm = { path = "../crates/voipc-opus-wasm" }
voipc-protocol = { path = "../crates/voipc-protocol" }
voipc-crypto = { path = "../crates/voipc-crypto" }
voipc-audio = { path = "../crates/voipc-audio" }
voipc-web = { path = "../crates/voipc-web" }
voipc-media = { path = "../crates/voipc-media" }

[[bin]]
name = "opus_decode"
path = "fuzz_targets/opus_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "codec"
path = "fuzz_targets/codec.rs"
test = false
doc = false
bench = false

