<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="theme-color" content="#1c1f24" />
    <title>VoIPC</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>

</html>
