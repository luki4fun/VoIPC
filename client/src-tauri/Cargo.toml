[package]
name = "voipc-client"
version.workspace = true
edition = "2021"
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "voipc_client_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
voipc-protocol = { path = "../../crates/voipc-protocol" }
voipc-audio = { path = "../../crates/voipc-audio" }
voipc-video = { path = "../../crates/voipc-video" }
voipc-crypto = { path = "../../crates/voipc-crypto" }
# Pictures other people made, decoded here and shown only as PNG it wrote
voipc-media = { path = "../../crates/voipc-media" }
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tokio = { version = "1", features = ["full"] }
# QUIC/WebTransport link to the server (quinn underneath); ring so the
# Windows and Android builds need no extra toolchain. "quinn" only unlocks
# Connection::quic_connection() (path stats for congestion detection).
wtransport = { version = "0.7", default-features = false, features = ["ring", "quinn"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std"] }
# The TCP fallback when UDP is blocked: TLS to the server's page port, where a
# WebSocket carries the session (transport.rs).
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
webpki-roots = "0.26"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
postcard = { version = "1.1", features = ["alloc"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
bytes = "1"
ringbuf = "0.5"
ring = "0.17"
base64 = "0.22"
# The share viewer's JPEG, desktop and Android (built from source for the NDK)
turbojpeg = "1.3"
rand = "0.8"
libsignal-protocol = { git = "https://github.com/signalapp/libsignal", tag = "v0.105.4" }
dirs = "6"

# Desktop-only dependencies (not available on Android)
[target.'cfg(not(target_os = "android"))'.dependencies]
# Adds the system-tray features on desktop (merged with the base tauri dep)
tauri = { version = "2", features = ["tray-icon", "image-png"] }
rdev = "0.5"
rodio = { version = "0.19", default-features = false, features = ["symphonia-mp3", "symphonia-wav", "symphonia-vorbis"] }
rfd = "0.15"
# The NSIS and AppImage builds update themselves (updater.rs). Without `zip`:
# the feed points at the installer and the AppImage themselves.
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls", "system-proxy"] }
# The one-click emote imports (emote_sources.rs): the updater's own client,
# with its TLS (ring, the system's roots), so no second stack comes in
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }

# TCP_NOTSENT_LOWAT for the TCP fallback, which only Linux and Android have
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
socket2 = { version = "0.6", features = ["all"] }

[target.'cfg(target_os = "android")'.dependencies]
tracing-android = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.9", default-features = false, features = ["tokio"] }
pipewire = "0.10"
evdev = "0.12"
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
cpal = { workspace = true }
windows = { version = "0.58", features = [
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    # MumbleLink: the block is a named file mapping on Windows
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_WindowsAndMessaging",
] }
