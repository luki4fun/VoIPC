name: Tests

# Runs on pushes to main and on pull requests, and as the gate the release
# workflow calls before it builds anything. Not on every branch push: a branch
# with a pull request would run twice. Not for a change that only touches docs,
# the website or the relay's Dockerfile: of those, only the version check reads
# a few, and the release gate (a workflow_call, which ignores the filter) still
# runs it.

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', 'website/**', '.impeccable/**', 'Dockerfile.relay']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', 'website/**', '.impeccable/**', 'Dockerfile.relay']
  workflow_call:
    # soak.yml: many copies of the browser jobs at once, and nothing else. Every other
    # caller (the release gate) and every other event gets one copy of everything.
    inputs:
      copies:
        description: The copies of each browser part, as a JSON list of numbers
        type: string
        default: '[1]'
      browser-only:
        description: Run the browser jobs alone
        type: boolean
        default: false

# Nothing here writes. Without this a push event's token gets the repository's
# default permissions, which may include write.
permissions:
  contents: read

concurrency:
  # `github.workflow` is the *caller's* name, so the copy the release workflow
  # calls sits in its own group. Without that, pushing again while a release is
  # building cancels the release's own test gate and with it the release.
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    if: ${{ !inputs.browser-only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # No token left in .git/config for build scripts to find
        with: { persist-credentials: false }

      # The same list the Linux release job installs; voipc-video links FFmpeg
      # and voipc-client links the desktop stack even for `cargo test`.
      - name: System dependencies
        run: |
          bash tools/ci-apt.sh \
            build-essential curl ca-certificates pkg-config nasm cmake protobuf-compiler \
            libavcodec-dev libavformat-dev libavfilter-dev libavdevice-dev \
            libavutil-dev libswscale-dev libx264-dev libx265-dev \
            libpipewire-0.3-dev libgbm-dev libasound2-dev libturbojpeg0-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev \
            libssl-dev libclang-dev

      - name: Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            crates/voipc-web -> target
            crates/voipc-opus-wasm -> target
            crates/voipc-media-wasm -> target

      # Before anything builds: a manifest edited without its lockfile fails
      # here, instead of CI resolving fresh versions nobody reviewed. With the
      # lockfiles consistent, no later cargo command can change them.
      - name: Lockfiles match the manifests
        run: for d in . crates/voipc-web crates/voipc-opus-wasm crates/voipc-media-wasm; do (cd "$d" && cargo fetch --locked); done

      - name: Version fields agree with Cargo.toml
        run: node tools/voipc.mjs version --check

      # Through tools/ci-run.sh so a failure repeats its tail as an annotation:
      # Actions logs need admin rights to read through the API, annotations do
      # not, so this is the only part of a red run anyone can actually see.
      - run: bash tools/ci-run.sh "cargo test" cargo test --workspace --locked

      # The picture sanitizer against the hardest pictures there are, timed:
      # only a release build says anything about time (voipc-media tests.rs)
      - name: Pictures are sanitized in time
        run: bash tools/ci-run.sh "picture timing" cargo test --locked --release -p voipc-media every_hard_picture

      # The browser half of the spatial maths and the room presets, under
      # Node's own test runner. Needs Node 22 for --experimental-strip-types;
      # the runner's default may be older.
      #
      # The client's dependencies are not optional here, even though the runner
      # is Node's own: room.test.ts and users.test.ts reach `svelte/store`
      # through room.ts and users.ts, and a fresh checkout has no node_modules
      # anywhere, so without this the step dies instantly on ERR_MODULE_NOT_FOUND.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - name: Client unit tests
        run: bash tools/ci-run.sh "client unit tests" npm --prefix client test

      # Separate workspace (wasm-only dependencies), so it needs its own run.
      - name: Test the wasm crate on the host
        run: bash ../../tools/ci-run.sh "wasm crate test" cargo test --locked
        working-directory: crates/voipc-web

      # The browser's Opus decoder, its own workspace too; its tests replay the
      # fuzz target on stable.
      - name: Test the Opus wasm crate on the host
        run: bash ../../tools/ci-run.sh "opus wasm crate test" cargo test --locked
        working-directory: crates/voipc-opus-wasm

  # Formatting, clippy and the front end's types, all as errors. Clippy and
  # rustfmt come from rust-toolchain.toml, so a new lint arrives only with a
  # deliberate toolchain bump, fixed in the same change.
  lint:
    name: Lint
    if: ${{ !inputs.browser-only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      # Clippy compiles the desktop client, so the same list as the Rust job
      - name: System dependencies
        run: |
          bash tools/ci-apt.sh \
            build-essential curl ca-certificates pkg-config nasm cmake protobuf-compiler \
            libavcodec-dev libavformat-dev libavfilter-dev libavdevice-dev \
            libavutil-dev libswscale-dev libx264-dev libx265-dev \
            libpipewire-0.3-dev libgbm-dev libasound2-dev libturbojpeg0-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev \
            libssl-dev libclang-dev

      - name: Rust toolchain
        run: rustup toolchain install && rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            crates/voipc-web -> target
            crates/voipc-opus-wasm -> target
            crates/voipc-media-wasm -> target

      - name: Lockfiles match the manifests
        run: for d in . crates/voipc-web crates/voipc-opus-wasm crates/voipc-media-wasm; do (cd "$d" && cargo fetch --locked); done

      - name: rustfmt
        run: |
          cargo fmt --all -- --check
          for d in crates/voipc-web crates/voipc-opus-wasm crates/voipc-media-wasm fuzz; do (cd "$d" && cargo fmt -- --check); done

      - name: clippy
        run: |
          bash tools/ci-run.sh "clippy" cargo clippy --workspace --all-targets --locked -- -D warnings
          for d in crates/voipc-web crates/voipc-opus-wasm crates/voipc-media-wasm; do
            (cd "$d" && bash ../../tools/ci-run.sh "clippy $d" \
              cargo clippy --locked --target wasm32-unknown-unknown --all-targets -- -D warnings)
          done

      # The relay decodes no picture (voipc-media is the clients'), and
      # zune-jpeg's SIMD paths, its only unsafe code, stay off everywhere
      - name: Picture decoders
        run: |
          if cargo tree --locked -p voipc-server -e normal --prefix none | grep -q '^voipc-media '; then
            echo "::error::voipc-server depends on voipc-media: the relay must not decode pictures"; exit 1
          fi
          if cargo tree --locked --workspace -e features -i zune-jpeg | grep -E 'zune-jpeg feature "(x86|neon)"'; then
            echo "::error::zune-jpeg is built with its SIMD (unsafe) features"; exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - name: TypeScript and Svelte
        working-directory: client
        run: |
          bash ../tools/ci-run.sh "tsc" npx tsc --noEmit
          bash ../tools/ci-run.sh "svelte-check" npx svelte-check --fail-on-warnings

  # Licences, crate sources and banned crates block always. A new RustSec
  # advisory shows on every push but blocks only a release: it lands without
  # a code change, and a pull request should not turn red for it.
  deny:
    name: cargo-deny
    if: ${{ !inputs.browser-only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_DENY_VERSION: '0.20.2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - name: Rust toolchain
        run: rustup toolchain install

      - name: Restore cargo-deny
        id: deny
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ env.CARGO_DENY_VERSION }}

      - name: Install cargo-deny
        if: steps.deny.outputs.cache-hit != 'true'
        run: cargo install --locked "cargo-deny@$CARGO_DENY_VERSION"

      - name: Save cargo-deny
        if: always() && steps.deny.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ env.CARGO_DENY_VERSION }}

      # deny.toml at the root; cargo-deny finds it from each workspace
      - name: Licences, sources, bans
        run: |
          for m in Cargo.toml crates/voipc-web/Cargo.toml crates/voipc-opus-wasm/Cargo.toml crates/voipc-media-wasm/Cargo.toml fuzz/Cargo.toml; do
            bash tools/ci-run.sh "cargo-deny $m" cargo deny --manifest-path "$m" check licenses sources bans
          done

      - name: Advisories
        continue-on-error: ${{ github.ref_type != 'tag' }}
        run: |
          for m in Cargo.toml crates/voipc-web/Cargo.toml crates/voipc-opus-wasm/Cargo.toml crates/voipc-media-wasm/Cargo.toml fuzz/Cargo.toml; do
            bash tools/ci-run.sh "cargo-deny advisories $m" cargo deny --manifest-path "$m" check advisories
          done

  browser:
    # A copy's number only in a soak: the pull-request checks keep the names they have
    # Quoted: in a plain YAML value a space and # start a comment, which cut this line once
    name: "Browser end-to-end (${{ matrix.part }}${{ inputs.browser-only && format(', copy {0}', matrix.copy) || '' }})"
    runs-on: ubuntu-24.04
    # Four parts side by side: the two lanes that run test-ui.mjs, the quick lanes
    # (under a minute each) and the relay on Postgres. One job ran the first three
    # in a row for 35 minutes. Each lane also has its own cap below, so a hang names
    # its lane instead of using up the job.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        part: [quic, udp-blocked, lanes, postgres]
        copy: ${{ fromJSON(inputs.copies || '[1]') }}
    # The image has both, and test-web.sh would pick `chromium` first — but that
    # one is an unbranded snapshot build (no proprietary codecs), so the browser
    # sharer quietly falls back to VP9 and no lane exercises the H.264 path that
    # every viewer, Android included, depends on. Google Chrome is also what the
    # people running this client actually have.
    env:
      CHROME: /usr/bin/google-chrome
      # test-web.sh copies every lane's output and relay log here; a red job uploads them
      KEEP_LOGS: ${{ github.workspace }}/browser-logs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # No token left in .git/config for build scripts to find
        with: { persist-credentials: false }

      - name: System dependencies
        run: |
          bash tools/ci-apt.sh \
            build-essential curl ca-certificates pkg-config nasm cmake protobuf-compiler \
            libavcodec-dev libavformat-dev libavfilter-dev libavdevice-dev \
            libavutil-dev libswscale-dev libx264-dev libx265-dev \
            libpipewire-0.3-dev libgbm-dev libasound2-dev libturbojpeg0-dev \
            libssl-dev libclang-dev \
            libnss3-tools \
            pulseaudio pulseaudio-utils

      # What the relay asks of its UDP socket (web.rs `UDP_BUFFER`), as OPERATING.md says to
      # set it on a server. Past this limit Linux gives less, and says nothing.
      - name: Room for the relay's UDP socket
        run: sudo sysctl -w net.core.rmem_max=4194304 net.core.wmem_max=4194304

      # certutil (libnss3-tools) is how the Firefox lane trusts the test CA.
      #
      # The sink is the other thing Firefox needs and Chrome does not. A runner
      # has no sound card, and Firefox has no fake audio output to fall back on:
      # its AudioContext never starts, so it neither captures voice (nothing is
      # sent, and the peer never even sees "speaking") nor renders any (nothing
      # to count). Every Firefox lane fails both voice checks while chat and
      # video pass — reproduced locally by hiding PulseAudio and ALSA, and fixed
      # by exactly this: a daemon whose only sink is a null one.
      - name: Audio sink for Firefox
        run: |
          pulseaudio --start --exit-idle-time=-1 || pulseaudio --daemonize --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=voipc-test
          pactl info   # fails the step here, not six checks later, if none of that worked

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Rust toolchain
        run: rustup toolchain install && rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: '. -> target'

      - name: Lockfiles match the manifests
        run: for d in . crates/voipc-web crates/voipc-opus-wasm crates/voipc-media-wasm; do (cd "$d" && cargo fetch --locked); done

      - run: npm ci
        working-directory: client

      # wasm + web bundle (with the self-test test-web.sh drives) + the server
      # that embeds it
      - run: npm run web
        env: { VOIPC_SELFTEST: '1' }

      # What test-move.mjs imports with: the importer's real driver against the
      # stand-in Discord. An example, which `npm run web` does not build.
      - run: cargo build --release --locked -p voipc-server --example import_replay
        env: { VOIPC_SELFTEST: '1' }

      # Both engines, and both mixed pairings: a Chromium sharer feeds a Firefox
      # viewer H.264, a Firefox sharer feeds a Chromium viewer VP9.
      # `!cancelled()` so one red lane does not hide the others: knowing
      # whether a failure is engine-specific is most of the diagnosis, and the
      # job still fails if any lane did.
      #
      # test-ui.mjs (its file section waits out the relay's one-minute file
      # cache) drives its own Chromium and reads none of these settings, so it
      # is the same test in every lane but where the network differs. It runs
      # in the `quic` part and with UDP blocked (the TCP fallback); UI_TEST:
      # '0' skips it in the others, and Firefox ↔ Firefox has no Chromium for
      # it. Those two lanes get 25 minutes, the others 10. test-web.sh runs its browser lanes
      # one after another here: SIDE_BY_SIDE: '1' takes 4 minutes off, and its failures on 4
      # cores were web.rs `LINGER`'s bug. Worth trying again once a few runs have been clean.
      - name: Chromium ↔ Chromium
        if: matrix.part == 'quic'
        timeout-minutes: 25
        run: ./test-web.sh
        env: { BROWSER: chromium }
      - name: Firefox ↔ Firefox
        if: ${{ !cancelled() && matrix.part == 'lanes' }}
        timeout-minutes: 10
        run: ./test-web.sh
        env: { BROWSER: firefox }
      - name: Chromium shares, Firefox watches
        if: ${{ !cancelled() && matrix.part == 'lanes' }}
        timeout-minutes: 10
        run: ./test-web.sh
        env: { BROWSER_ALICE: chromium, BROWSER_BOB: firefox, UI_TEST: '0' }
      - name: Firefox shares, Chromium watches
        if: ${{ !cancelled() && matrix.part == 'lanes' }}
        timeout-minutes: 10
        run: ./test-web.sh
        env: { BROWSER_ALICE: firefox, BROWSER_BOB: chromium, UI_TEST: '0' }
      # The TCP fallback for servers whose UDP is blocked: the whole run over
      # the WebSocket tunnel, then a Firefox sharer on the tunnel (its
      # WebSocket must land on http/1.1, not the page's h2) against a
      # Chromium viewer on QUIC — the relay is the same across the two.
      - name: Chromium ↔ Chromium over TCP
        if: ${{ !cancelled() && matrix.part == 'lanes' }}
        timeout-minutes: 10
        run: ./test-web.sh
        env: { BROWSER: chromium, TRANSPORT: tcp, UI_TEST: '0' }
      - name: Firefox over TCP shares, Chromium over QUIC watches
        if: ${{ !cancelled() && matrix.part == 'lanes' }}
        timeout-minutes: 10
        run: ./test-web.sh
        env: { BROWSER_ALICE: firefox, TRANSPORT_ALICE: tcp, BROWSER_BOB: chromium, UI_TEST: '0' }
      # A network that drops UDP: both browsers ask for QUIC and must race
      # over to the TCP fallback on their own. Only the first two test relays
      # are blocked; the accounts relay of test-ui.mjs keeps its UDP.
      - name: UDP blocked — both fall back to TCP
        if: matrix.part == 'udp-blocked'
        timeout-minutes: 25
        run: |
          rule=(INPUT -i lo -p udp --dport 19987:19988 -j DROP)
          sudo iptables -I "${rule[@]}"
          trap 'sudo iptables -D "${rule[@]}"' EXIT
          ./test-web.sh
        env: { BROWSER: chromium, EXPECT_FALLBACK: '1' }
      # Delay, jitter (which also reorders) and 5 % loss on loopback. It gates
      # since 1.5: as report-only it had passed for a while, and its one
      # failure (voice decoded by WebCodecs instead of the worklet's Opus) went
      # unseen, because a report-only step that fails still shows as passed.
      #
      # FILE_KIB '0': no file transfer. 10 MiB under 5 % loss outlasts the
      # self-test's deadline, and the lane is about voice; the other lanes
      # carry the file.
      - name: Lossy link (netem)
        if: ${{ !cancelled() && matrix.part == 'lanes' }}
        timeout-minutes: 15
        run: |
          if ! sudo modprobe sch_netem; then
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe sch_netem
          fi
          sudo tc qdisc add dev lo root netem delay 40ms 20ms loss 5%
          trap 'sudo tc qdisc del dev lo root' EXIT
          ./test-web.sh
        env: { BROWSER: chromium, UI_TEST: '0', FILE_KIB: '0' }

      # The relay on Postgres, which nothing above reaches: the accounts tests that take a
      # second database, and the lanes that read and write it most. The runner's own Postgres,
      # so no image to pin. Each lane is its own step, so one red does not hide the others.
      - name: Start Postgres
        if: matrix.part == 'postgres'
        run: |
          sudo systemctl start postgresql.service
          mkdir -p "$KEEP_LOGS"   # where the lanes below write their relay logs
          sudo -u postgres psql -c "CREATE ROLE voipc SUPERUSER LOGIN PASSWORD 'voipc'"
          for name in tests community moderation move; do
            PGPASSWORD=voipc createdb -h 127.0.0.1 -U voipc "$name"
          done
      # --release: `npm run web` has built every dependency that way already. Only the tests
      # that take a second database: all the others stay on SQLite whatever this says.
      - name: Accounts tests on Postgres
        if: matrix.part == 'postgres'
        timeout-minutes: 15
        run: bash tools/ci-run.sh "accounts tests on Postgres" cargo test --release --locked -p voipc-server --bin voipc-server -- moderator_group accounts::placeholder::tests
        env: { VOIPC_SELFTEST: '1', VOIPC_TEST_POSTGRES: 'postgres://voipc:voipc@127.0.0.1:5432/tests' }
      - name: Community lane on Postgres
        if: ${{ !cancelled() && matrix.part == 'postgres' }}
        timeout-minutes: 10
        run: bash tools/ci-run.sh "community lane on Postgres" node test-community.mjs 29400
        env:
          COMMUNITY_DATABASE: 'postgres://voipc:voipc@127.0.0.1:5432/community'
          RELAY_LOG: ${{ github.workspace }}/browser-logs/postgres-community-relay.log
          RUST_LOG: voipc_server=debug,accounts=info
      - name: Moderation lane on Postgres
        if: ${{ !cancelled() && matrix.part == 'postgres' }}
        timeout-minutes: 15
        run: bash tools/ci-run.sh "moderation lane on Postgres" node test-moderation.mjs 29600
        env:
          MODERATION_DATABASE: 'postgres://voipc:voipc@127.0.0.1:5432/moderation'
          RELAY_LOG: ${{ github.workspace }}/browser-logs/postgres-moderation-relay.log
          RUST_LOG: voipc_server=debug,accounts=info
      - name: Move lane on Postgres
        if: ${{ !cancelled() && matrix.part == 'postgres' }}
        timeout-minutes: 15
        run: bash tools/ci-run.sh "move lane on Postgres" node test-move.mjs 29800
        env:
          MOVE_DATABASE: 'postgres://voipc:voipc@127.0.0.1:5432/move'
          RELAY_LOG: ${{ github.workspace }}/browser-logs/postgres-move-relay.log
          RUST_LOG: voipc_server=debug,accounts=info

      # What the lanes said and their relays logged, for a red job: a timeout's diagnosis
      # names the requests a page was waiting on, and the relay log what it refused then
      - name: Lane logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-logs-${{ matrix.part }}-${{ matrix.copy }}
          path: ${{ github.workspace }}/browser-logs
          if-no-files-found: ignore
          retention-days: 7

  # The Windows and Android builds compile on every pull request, not first
  # in a release run. cargo check only, with the caches release.yml uses.
  cross:
    name: Windows and Android cargo check
    if: ${{ !inputs.browser-only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_XWIN_VERSION: '0.23.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - name: Cross toolchain
        run: |
          bash tools/ci-apt.sh \
            clang lld llvm ninja-build cmake nasm protobuf-compiler unzip curl pkg-config

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Rust toolchain
        run: rustup toolchain install && rustup target add x86_64-pc-windows-msvc aarch64-linux-android

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: '. -> target'

      - name: Lockfiles match the manifests
        run: cargo fetch --locked

      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Restore cargo-xwin
        id: xwin
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-xwin
          key: cargo-xwin-${{ env.CARGO_XWIN_VERSION }}

      - name: Install cargo-xwin
        if: steps.xwin.outputs.cache-hit != 'true'
        run: cargo install --locked "cargo-xwin@$CARGO_XWIN_VERSION"

      - name: Restore the pinned Windows FFmpeg
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/voipc/ffmpeg-win64
          key: voipc-ffmpeg-win64-${{ hashFiles('tools/tasks/windows-cross.mjs') }}

      # check:windows downloads FFmpeg only on a cache miss, checked against
      # its pinned SHA-256. A miss is the usual case: caches are scoped by ref,
      # so what a release run saves stays with its tag and no PR sees it.
      - name: Windows
        run: bash tools/ci-run.sh "windows check" node tools/voipc.mjs check:windows

      - name: Android
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.0.13004108"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.0.13004108"
          bash tools/ci-run.sh "android check" node tools/voipc.mjs android check
