name: Release

# Builds every artifact for a release and opens it as a draft for review.
#
# Push a tag to build a release:   git tag v0.7.0 && git push origin v0.7.0
# Or run it manually from the Actions tab to rehearse the whole thing first.
on:
  workflow_dispatch:
    inputs:
      default_server:
        description: >-
          Bake this server into the connect dialog (host or host:port) — for a
          demo build. Leave empty for a normal release.
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Fail before spending an hour of runner time if the tag and the tree
  # disagree, and pull the release notes out of the changelog.
  meta:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve and verify the version
        id: v
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Cargo.toml version: $version"

          # The server compares client and server version strings for exact
          # equality, so a release whose tag and tree disagree ships clients
          # that every server rejects.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$version" ]; then
              echo "::error::tag v$tag does not match Cargo.toml version $version"
              exit 1
            fi
          fi

      - name: Check every copy of the version agrees
        run: node tools/voipc.mjs version --check

      - name: Extract the changelog section
        run: |
          version="${{ steps.v.outputs.version }}"
          # The changelog is hand-written prose and is the release-notes source;
          # do not generate notes from commit subjects.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::no '## [$version]' section found in CHANGELOG.md"
            exit 1
          fi
          cat notes.md

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: notes.md

  # Nothing is built until the suite that covers it passes.
  test:
    uses: ./.github/workflows/test.yml

  linux:
    needs: [meta, test]
    runs-on: ubuntu-24.04   # glibc 2.39, matching Dockerfile.release
    steps:
      - uses: actions/checkout@v5

      - name: System dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential curl ca-certificates pkg-config nasm cmake protobuf-compiler \
            libavcodec-dev libavformat-dev libavfilter-dev libavdevice-dev \
            libavutil-dev libswscale-dev libx265-dev \
            libpipewire-0.3-dev libgbm-dev libasound2-dev libturbojpeg0-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev \
            libssl-dev libclang-dev musl-tools file

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl, wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - run: npm ci
        working-directory: client

      # Every build runs through tools/ci-run.sh: reading Actions logs through
      # the API needs admin rights on the repository, annotations need none, so
      # a failure repeats its own tail into one. Without that a red build job is
      # a black box to anyone without push access.
      #
      # The server embeds client/dist-web at compile time, so the web bundle
      # has to exist before the server is built.
      - name: Build the web client
        env:
          VITE_DEFAULT_SERVER: ${{ inputs.default_server }}
        run: bash ../tools/ci-run.sh "linux web client" npm run build:web
        working-directory: client

      - name: Build the server (static musl)
        run: >-
          bash tools/ci-run.sh "linux server"
          cargo build -p voipc-server --release --target x86_64-unknown-linux-musl

      - name: Build the desktop client (AppImage + deb)
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1   # appimagetool cannot use FUSE on a runner
          VITE_DEFAULT_SERVER: ${{ inputs.default_server }}
        run: bash tools/ci-run.sh "linux desktop client" node tools/voipc.mjs build

      - name: Collect artifacts
        run: |
          v="${{ needs.meta.outputs.version }}"
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/voipc-server dist/voipc-server-linux-x86_64
          cp target/release/bundle/appimage/*.AppImage dist/
          cp target/release/bundle/deb/*.deb dist/
          tar -czf "dist/VoIPC-web-$v.tar.gz" -C client dist-web
          ls -lh dist/

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          if-no-files-found: error
          path: dist/*

  # Windows is cross-built from Linux, by the same task the maintainer runs at
  # home (`npm run build:windows`), so a red CI build can be reproduced in
  # minutes instead of guessed at.
  #
  # This used to build natively on windows-2025 against FFmpeg from vcpkg. That
  # path shared no code with the one anyone actually runs and never once
  # succeeded: vcpkg follows FFmpeg head — the runner image's vcpkg is on 9.0.1
  # — while ffmpeg-sys-next 8.1 stops at libavcodec 62, so every attempt
  # compiled for eight minutes and then died in the bindings, after a 40-minute
  # FFmpeg build that a failing job never got to cache. The cross build pins
  # FFmpeg 8.1 and verifies its ABI major before compiling anything.
  windows:
    needs: [meta, test]
    runs-on: ubuntu-24.04
    env:
      # Pinned so releases are reproducible and the cache key means something.
      CARGO_XWIN_VERSION: '0.23.1'
    steps:
      - uses: actions/checkout@v5

      # Ubuntu ships no clang-cl — only Arch does — so ensureClangCl() in the
      # task links one from clang, which picks its cl driver mode from argv[0].
      - name: Cross toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm ninja-build cmake nasm protobuf-compiler \
            nsis unzip curl

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      # restore/save rather than actions/cache, whose post step is
      # `post-if: success()` and therefore saves nothing when the job fails —
      # which is how the old vcpkg job managed to rebuild FFmpeg from source on
      # every single retry.
      - name: Restore cargo-xwin
        id: xwin
        uses: actions/cache/restore@v5
        with:
          path: ~/.cargo/bin/cargo-xwin
          key: cargo-xwin-${{ env.CARGO_XWIN_VERSION }}

      - name: Install cargo-xwin
        if: steps.xwin.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-xwin@${{ env.CARGO_XWIN_VERSION }}

      - name: Save cargo-xwin
        if: always() && steps.xwin.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ~/.cargo/bin/cargo-xwin
          key: cargo-xwin-${{ env.CARGO_XWIN_VERSION }}

      # The prebuilt Windows FFmpeg the task downloads. The key is the asset
      # name, which is the version pin; setup:windows then checks that
      # libavcodec really is major 62 before anything is compiled against it.
      - name: Restore the pinned Windows FFmpeg
        id: ffmpeg
        uses: actions/cache/restore@v5
        with:
          path: ~/.local/share/voipc/ffmpeg-win64
          key: voipc-ffmpeg-win64-n8.1-gpl-shared

      - name: Windows toolchain and FFmpeg
        run: bash tools/ci-run.sh "windows setup" node tools/voipc.mjs setup:windows

      - name: Save the pinned Windows FFmpeg
        if: always() && steps.ffmpeg.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ~/.local/share/voipc/ffmpeg-win64
          key: voipc-ffmpeg-win64-n8.1-gpl-shared

      # auditImports() fails the build if the exe imports ucrtbased.dll, or any
      # DLL that is neither part of Windows nor bundled beside it — what the old
      # dumpbin step checked, and more.
      - name: Build the client (NSIS)
        env:
          VITE_DEFAULT_SERVER: ${{ inputs.default_server }}
        run: bash tools/ci-run.sh "windows build" node tools/voipc.mjs build:windows

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe dist/
          ls -lh dist/

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          if-no-files-found: error
          path: dist/*

  # The one thing a Windows runner is still needed for: proving the installer
  # the cross build produced really installs and starts on real Windows.
  windows-smoke:
    needs: windows
    runs-on: windows-2025
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows
          path: dist

      - name: Install the app and check it stays up
        run: |
          $setup = Get-ChildItem dist\*-setup.exe -ErrorAction SilentlyContinue |
                   Select-Object -First 1
          if (-not $setup) { throw "no NSIS installer in the windows artifact" }
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs\VoIPC\VoIPC.exe",`
                               "$env:ProgramFiles\VoIPC\VoIPC.exe" -ErrorAction SilentlyContinue |
                 Select-Object -First 1
          if (-not $exe) { throw "Installed VoIPC.exe not found after silent install" }
          $p = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "VoIPC exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          Write-Host "[ok] App launched and stayed alive"

  android:
    needs: [meta, test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Check the signing secrets are configured
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set — skipping the Android build."
          fi

      - uses: actions/setup-java@v5
        if: steps.signing.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v5
        if: steps.signing.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        if: steps.signing.outputs.ready == 'true'
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        if: steps.signing.outputs.ready == 'true'
        with:
          workspaces: '. -> target'

      # ANDROID_HOME is set on the runner machine, not in the workflow `env`
      # context, so the NDK path is exported through GITHUB_ENV for later steps.
      - name: Install the Android NDK
        if: steps.signing.outputs.ready == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake protobuf-compiler
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.0.13004108"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> "$GITHUB_ENV"

      # build.gradle.kts reads keystore.properties from the repo root and
      # resolves storeFile relative to that file, so both land side by side.
      - name: Reconstruct the signing keystore
        if: steps.signing.outputs.ready == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 -d > voipc-release.jks
          # A .properties file is read by java.util.Properties, which treats a
          # backslash as an escape — an unescaped one in a password silently
          # produces a different string and Gradle reports "keystore password
          # was incorrect".
          esc() { printf '%s' "$1" | sed 's/\\/\\\\/g'; }
          {
            echo "storeFile=voipc-release.jks"
            echo "storePassword=$(esc "$STORE_PASSWORD")"
            echo "keyAlias=$(esc "$KEY_ALIAS")"
            echo "keyPassword=$(esc "$KEY_PASSWORD")"
          } > keystore.properties

      - name: Build the signed APK
        if: steps.signing.outputs.ready == 'true'
        env:
          VITE_DEFAULT_SERVER: ${{ inputs.default_server }}
        run: >-
          bash tools/ci-run.sh "android build"
          node tools/voipc.mjs android release --target aarch64

      - name: Remove the signing material
        if: always() && steps.signing.outputs.ready == 'true'
        run: rm -f voipc-release.jks keystore.properties

      - name: Collect artifacts
        if: steps.signing.outputs.ready == 'true'
        run: |
          v="${{ needs.meta.outputs.version }}"
          mkdir -p dist
          cp release/VoIPC-android-release.apk "dist/VoIPC-android-$v.apk"

      - uses: actions/upload-artifact@v7
        if: steps.signing.outputs.ready == 'true'
        with:
          name: android
          if-no-files-found: error
          path: dist/*

  publish:
    needs: [meta, linux, windows, windows-smoke, android]
    # Publish whatever built, as long as nothing outright failed.
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Flatten the artifacts
        run: |
          mkdir -p dist
          find artifacts -type f ! -name notes.md -exec cp {} dist/ \;
          ls -lh dist/

      - name: Create the draft release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          name: v${{ needs.meta.outputs.version }}
          body_path: artifacts/release-notes/notes.md
          files: dist/*
