name: Nightly

# Slow checks that need no pull request to trigger them.
#
# GitHub turns a scheduled workflow off after 60 days without activity in the
# repository. After a quiet spell, turn it back on in the Actions tab.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Every trust-boundary parser, ten minutes each (fuzz/README.md). The corpus
  # carries over from night to night in the cache. A crash fails the job,
  # repeats its tail as an annotation and uploads the input; it becomes a file
  # in fuzz/regressions/<target>/, which `cargo test` replays on stable, and a
  # finding for whoever owns that code.
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [codec, compat, media_packets, video_assembly, ws, envelope, keys, log, file,
                 vault, pair, jitter, opus, game, web_media, opus_decode, media, import]
    env:
      NIGHTLY: nightly-2026-10-23
      CARGO_FUZZ_VERSION: '0.13.2'
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - name: System dependencies
        run: |
          bash tools/ci-apt.sh \
            build-essential pkg-config cmake protobuf-compiler libasound2-dev libclang-dev

      - name: Rust nightly
        # The pinned stable too: cargo-fuzz installs, and the lockfile check runs, with it
        run: rustup toolchain install && rustup toolchain install "$NIGHTLY" --profile minimal

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: 'fuzz -> target'
          shared-key: fuzz

      - name: Restore cargo-fuzz
        id: cargo-fuzz
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-${{ env.CARGO_FUZZ_VERSION }}

      - name: Install cargo-fuzz
        if: steps.cargo-fuzz.outputs.cache-hit != 'true'
        run: cargo install --locked "cargo-fuzz@$CARGO_FUZZ_VERSION"

      - name: Save cargo-fuzz
        if: always() && steps.cargo-fuzz.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-${{ env.CARGO_FUZZ_VERSION }}

      - name: Lockfile matches the manifest
        run: cargo fetch --locked
        working-directory: fuzz

      - name: Restore the corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Fuzz
        working-directory: fuzz
        run: |
          mkdir -p "corpus/$TARGET"
          bash ../tools/ci-run.sh "fuzz $TARGET" \
            cargo "+$NIGHTLY" fuzz run "$TARGET" "corpus/$TARGET" -- -max_total_time=600

      - name: Save the corpus
        if: always()
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

      - name: Upload the crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}

  # The release's static server, its web tarball and the wasm inside it are
  # reproducible: the same commit builds the same bytes. Built twice from
  # clean, at the same paths (absolute paths end up in panic messages), and
  # compared. The desktop bundles are rebuildable but not bit-identical: they
  # carry the runner's apt libraries of the day (BUILDING.md).
  repro:
    name: Reproducible server and web bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - name: System dependencies
        run: |
          bash tools/ci-apt.sh \
            build-essential pkg-config cmake protobuf-compiler musl-tools

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Rust toolchain
        run: rustup toolchain install && rustup target add x86_64-unknown-linux-musl wasm32-unknown-unknown

      - name: Lockfiles match the manifests
        run: for d in . crates/voipc-web crates/voipc-opus-wasm crates/voipc-media-wasm; do (cd "$d" && cargo fetch --locked); done

      - run: npm ci
        working-directory: client

      - name: Build twice and compare
        run: |
          # What release.yml's linux job does, into $1
          build() {
            (cd client && npm run build:web)
            cargo build -p voipc-server --release --locked --target x86_64-unknown-linux-musl
            mkdir -p "$1"
            cp target/x86_64-unknown-linux-musl/release/voipc-server client/src/lib/wasm/*.wasm "$1/"
            # The same command as release.yml's "Collect artifacts"
            tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 --numeric-owner \
              -cf - -C client dist-web | gzip -9n > "$1/web.tar.gz"
          }
          clean() {
            cargo clean
            (cd crates/voipc-web && cargo clean)
            rm -rf client/dist-web client/src/lib/wasm
          }
          # Two lines: `export X="$(…)"` would hide a failed git log behind
          # export's own success, and both builds would run with no epoch.
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          build "$RUNNER_TEMP/a"
          clean
          build "$RUNNER_TEMP/b"
          (cd "$RUNNER_TEMP/a" && sha256sum -- *) | tee "$RUNNER_TEMP/a.sums"
          (cd "$RUNNER_TEMP/b" && sha256sum -- *) > "$RUNNER_TEMP/b.sums"
          if ! diff "$RUNNER_TEMP/a.sums" "$RUNNER_TEMP/b.sums"; then
            differ=$(diff "$RUNNER_TEMP/a.sums" "$RUNNER_TEMP/b.sums" | sed -n 's/^< [0-9a-f]*  //p' | tr '\n' ' ')
            echo "::error title=not reproducible::two clean builds of $GITHUB_SHA differ in: $differ"
            exit 1
          fi

  # Since 1.6 the apps talk to relays up to three protocols older
  # (voipc_protocol::compat). The released relay of each, spoken to in its own
  # protocol: sign-in, a channel, and voice relayed back (voice_load). A
  # protocol bump adds its last release here, and a raised
  # OLDEST_RELAY_PROTOCOL drops the oldest.
  old-relays:
    name: Older relays
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - name: System dependencies
        run: |
          bash tools/ci-apt.sh \
            build-essential pkg-config cmake protobuf-compiler

      - name: Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - run: cargo build -p voipc-server --example voice_load --locked

      - name: Each older relay
        run: |
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -days 1 \
            -keyout "$RUNNER_TEMP/key.pem" -out "$RUNNER_TEMP/cert.pem" \
            -subj /CN=localhost -addext subjectAltName=IP:127.0.0.1 2>/dev/null
          port=49987
          for v in 1.0.0 1.3.1 1.4.0 1.6.0 1.7.0-rc.1 1.11.0-rc.1 1.11.0; do
            d="$RUNNER_TEMP/v$v"
            mkdir -p "$d/run"
            (cd "$d" && gh release download "v$v" --repo "$GITHUB_REPOSITORY" \
              -p voipc-server-linux-x86_64 -p SHA256SUMS && sha256sum -c --ignore-missing SHA256SUMS)
            chmod +x "$d/voipc-server-linux-x86_64"
            (cd "$d/run" && exec "$d/voipc-server-linux-x86_64" --host 127.0.0.1 --tcp-port "$port" \
              --udp-port "$port" --cert "$RUNNER_TEMP/cert.pem" --key "$RUNNER_TEMP/key.pem") >"$d/relay.log" 2>&1 &
            pid=$!
            sleep 2
            if ! timeout 60 target/debug/examples/voice_load 3 "127.0.0.1:$port" 8; then
              tail -20 "$d/relay.log"
              echo "::error title=older relay::this app cannot talk to the $v relay"
              exit 1
            fi
            kill "$pid"
            port=$((port + 1))
          done

  # The native Windows build: setup.ps1, then the desktop task's Windows branch
  # (MSVC environment, the pinned FFmpeg, DLL staging). Releases are
  # cross-built on Linux, so nothing else runs this path, and a failure here is
  # a Windows developer's `npm run dev` that no longer works.
  windows-native:
    name: Windows native build
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      # The image has Rust, CMake, LLVM and Visual Studio. NASM and protoc come
      # from Chocolatey: what setup.ps1 installs with winget reaches PATH only
      # in a new terminal, which a job never opens.
      - name: NASM and protoc
        run: |
          choco install nasm protoc -y --no-progress
          Add-Content $env:GITHUB_PATH "C:\Program Files\NASM"

      - name: Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: '. -> target'

      - name: setup.ps1
        run: .\setup.ps1

      - name: Debug build, no installer
        run: node tools/voipc.mjs build --debug --no-bundle
