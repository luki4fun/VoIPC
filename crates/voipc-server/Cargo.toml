[package]
name = "voipc-server"
version.workspace = true
edition.workspace = true

[[bin]]
name = "voipc-server"
path = "src/main.rs"

[dependencies]
voipc-protocol = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
serde = { workspace = true }
postcard = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
bytes = { workspace = true }
dashmap = "6"
rand = "0.8"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
serde_json = "1.0"
zeroize = { version = "1", features = ["derive"] }
socket2 = { version = "0.6.2", features = ["all"] }
subtle = "2"
sha2 = "0.10"
# The TCP fallback's WebSocket handshake (Sec-WebSocket-Accept is base64 of a
# SHA-1); both already come in through rustls and the client.
ring = "0.17"
base64 = "0.22"

# Web client: HTTP/2-only static page (no http1 feature, on purpose) and the
# QUIC/WebTransport endpoint all clients use. wtransport stays on ring so the
# musl build is static; "quinn" exposes the QUIC transport settings.
hyper = { version = "1", features = ["http2", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
wtransport = { version = "0.7", features = ["quinn"] }
rust-embed = { version = "8", features = ["debug-embed", "mime-guess"] }
hex = "0.4"

# Opt-in relay accounts (`[accounts]` in the config). SQLite for a small relay,
# Postgres for a big one, chosen by the database URL; SQLite is bundled, so the
# musl build stays static. Postgres speaks TLS through rustls on ring.
# To build against a checkout of l4f-accounts next to this repo, add
#   [patch."https://github.com/luki4fun/l4f-accounts.git"]
#   l4f-accounts = { path = "../l4f-accounts" }
# to the workspace Cargo.toml while you need it; commit neither that nor the
# Cargo.lock it changes.
l4f-accounts = { git = "https://github.com/luki4fun/l4f-accounts.git", tag = "v0.9.0", features = ["postgres", "sqlite"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "sqlite", "migrate", "macros"] }

[dev-dependencies]
# For the voice_load example (Opus encoding + media encryption of the test tone)
voipc-audio = { workspace = true }
voipc-crypto = { workspace = true }
