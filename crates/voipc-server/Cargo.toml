[package]
name = "voipc-server"
version.workspace = true
edition.workspace = true

[[bin]]
name = "voipc-server"
path = "src/main.rs"

[dependencies]
voipc-protocol = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
serde = { workspace = true }
postcard = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
bytes = { workspace = true }
dashmap = "6"
rand = "0.8"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
serde_json = "1.0"
zeroize = { version = "1", features = ["derive"] }
socket2 = { version = "0.6.2", features = ["all"] }
subtle = "2"
sha2 = "0.10"

# Web client: HTTP/2-only static page (no http1 feature, on purpose) and the
# QUIC/WebTransport endpoint all clients use. wtransport stays on ring so the
# musl build is static.
hyper = { version = "1", features = ["http2", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
wtransport = "0.7"
rust-embed = { version = "8", features = ["debug-embed", "mime-guess"] }
hex = "0.4"

[dev-dependencies]
# For the voice_load example (Opus encoding + media encryption of the test tone)
voipc-audio = { workspace = true }
voipc-crypto = { workspace = true }
