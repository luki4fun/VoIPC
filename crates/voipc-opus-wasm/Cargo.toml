[package]
name = "voipc-opus-wasm"
version = "0.12.0"
edition = "2021"
license = "MIT"
description = "The browser's Opus decoder, run inside the mixer's AudioWorklet (in-order decode, FEC, PLC)"
publish = false

# Standalone workspace, like voipc-web: built for wasm32 by `npm run build:wasm`
# and fuzzed natively (fuzz/), never part of the native app.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pinned: new decoder code on the browser's trust boundary, fuzzed as it is
# (fuzz/fuzz_targets/opus_decode.rs)
rusty-opus = "=1.0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
# A panic traps; the worklet catches the trap and falls back to silence
panic = "abort"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }
