[package]
name = "voipc-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# The account sign-in speaks the wire messages (account.rs)
voipc-protocol = { workspace = true }

# Signal Protocol — official Rust implementation (requires Rust >= 1.88)
libsignal-protocol = { git = "https://github.com/signalapp/libsignal", tag = "v0.105.4" }

# Symmetric encryption for media (voice/video) and state persistence
ring = "0.17"
rand = "0.9"

# Key derivation
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"

# Serialization for persistent state
serde = { workspace = true }
serde_json = "1"
postcard = { workspace = true }

# The authenticator-app QR code, drawn here: an SVG the relay sent would be
# markup a hostile relay wrote (account.rs `qr_svg`)
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

# Secret zeroization
zeroize = { version = "1", features = ["derive", "serde"] }

# Async trait support + UUID for sender keys
async-trait = "0.1"
uuid = { version = "1", features = ["v5"] }

# Error handling / logging
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# wasm32 has no SystemTime::now(); read the JS clock instead (see time::now)
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

# fuzz/ builds this crate with --cfg fuzzing (src/fuzz.rs)
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }
