[package]
name = "voipc-web"
version = "1.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.99"
description = "VoIPC protocol codec, Signal Protocol and media crypto compiled to wasm for the browser client"
publish = false

# Standalone workspace: the wasm-only features below must never leak into the native build (the root workspace excludes
# this path). voipc-protocol/voipc-crypto still inherit their version from the
# root workspace, so APP_VERSION stays the single source of truth.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
voipc-protocol = { path = "../voipc-protocol" }
voipc-crypto = { path = "../voipc-crypto" }
# Same source as voipc-crypto (Cargo unifies it); needed to read the pre-key
# records back out of the stores when building the Authenticate bundle.
libsignal-protocol = { git = "https://github.com/signalapp/libsignal", tag = "v0.105.4" }

serde = { version = "1.0", features = ["derive"] }
postcard = { version = "1.1", features = ["alloc"] }
anyhow = "1.0"
rand = "0.9"
# libsignal futures over the in-memory stores complete on the first poll
futures-util = { version = "0.3", default-features = false }

wasm-bindgen = "0.2"
serde_json = "1"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
console_error_panic_hook = "0.1"

# Browser entropy for every getrandom in the tree (0.2 through older crates,
# 0.3 through rand 0.9 with its backend selected in .cargo/config.toml, 0.4
# through libsignal) and for ring's AES-GCM.
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
ring = { version = "0.17", features = ["wasm32_unknown_unknown_js"] }

[profile.release]
opt-level = "s"

# fuzz/ builds this crate with --cfg fuzzing (src/fuzz.rs)
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }
